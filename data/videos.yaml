# ============================================================
#  VIDEOS.YAML — cole o link do YouTube para adicionar um vídeo
# ============================================================
# Regra:
#  - O PRIMEIRO item da lista é sempre o Demo Reel (aparece na Hero).
#  - Todos os itens a partir do segundo aparecem, na ordem, no
#    carrossel da seção "Trabalhos".
#
# Pode colar o link completo (watch?v=, youtu.be/, /shorts/) ou
# apenas o ID do vídeo — os dois formatos funcionam.
# ============================================================

videos:
  - "https://www.youtube.com/watch?v=yPnMpKNPJ_w"
  - "https://youtube.com/shorts/cdDGNxaiZ90?feature=share"
  - "https://youtube.com/shorts/XUhtGM5uUHk?feature=share"
  - "https://youtube.com/shorts/lDMsxaeW8ec?feature=share"
  - "https://youtube.com/shorts/6egQChRUwSE?feature=share"
  - "https://youtube.com/shorts/XIwoqisqwRw?feature=share"
  - "https://youtube.com/shorts/5IxaXXfBBcs?feature=share"
